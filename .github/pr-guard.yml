# pr-guard policy: .github/pr-guard.yml. `pr-guard init` prints this file; every key may be left out, and what is left
# out keeps the value written here.

# shadow: report on every pull request, never fail. enforce: the pr-guard status fails when the policy blocks and
# waits for the approvals the verdict asks for. Stay in shadow until the answers look right on your pull requests.
mode: shadow

# The model: pr-guard:<version> (a release this pr-guard was tested with), pr-guard:latest (the newest published),
# hf:<owner>/<repo>[@<revision>] (your own on Hugging Face; $HF_TOKEN for a private one), an https:// URL serving the
# files (a CDN or mirror), or a directory.
model: pr-guard:1

# Reviewers from the combined score (0 to 100%, the weighted mean of the answers, 100% the safe side).
reviewers:
  none: 85%   # at or above: no review needed
  one: 60%    # at or above: one reviewer; below: two

# What the model is asked. warn (at least one reviewer) and block (two reviewers; fails the status in enforce mode)
# when the risky answer is more likely than this: the percentage the comment shows; `off` never acts.
questions:
  description:   { weight: 2, warn: 40%, block: 70% }   # does something other than the description says
  vulnerability: { weight: 3, warn: 70% }               # introduces a vulnerability
  breaking:      { weight: 2, warn: 50% }               # breaks existing users
  tests:         { weight: 2, warn: 50% }               # the tests do not cover it
  size:          { weight: 1, warn: very large }        # trivial, small, medium, large, very large

# Deterministic checks, before the model and without it: block, warn, note or off.
rules:
  secrets: block
  destructive_sql: block
  big_change: { lines: 800, level: warn }
  dependencies: note
  sensitive_paths:
    level: warn
    paths:
      - .github/workflows/**
      - "**/auth/**"
      - "**/*auth*.*"
      - "**/migrations/**"
      - "**/Dockerfile"
      - "**/*.tf"
      - "**/.env*"

# This label on a pull request skips the check.
skip_label: pr-guard:skip

# Label pull requests that need no reviewer pr-guard:auto-merge, for your automation to merge.
auto_merge: false
